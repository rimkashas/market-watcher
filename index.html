<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Watcher — 2026-10-21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --ink: #1a1917;
  --muted: #6b6560;
  --line: #e6e2da;
  --accent: #b45309;
  --up: #15803d;
  --down: #b91c1c;
  --warn: #b45309;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
nav {
  position: sticky; top: 0; z-index: 10;
  background: rgba(246,244,239,.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
  margin: -24px -16px 20px;
  padding-left: 16px; padding-right: 16px;
}
nav a {
  display: inline-block; margin-right: 14px;
  font-size: 13px; color: var(--muted); text-decoration: none;
  padding: 4px 0; border-bottom: 2px solid transparent;
}
nav a:hover, nav a.active { color: var(--ink); border-bottom-color: var(--accent); }
.kicker { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font-family: Newsreader, serif; font-weight: 500; font-size: 28px; margin: 0 0 6px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 24px; font-size: 14.5px; }
.section { margin-bottom: 32px; }
.section h2 { font-family: Newsreader, serif; font-weight: 500; font-size: 20px; margin: 0 0 12px; }
.tape { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 640px) { .tape { grid-template-columns: 1fr 1fr; } }
.cell {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
}
.cell .label { font-size: 12px; color: var(--muted); }
.cell .value { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 16px; }
.cell .meaning { font-size: 13px; color: var(--muted); margin-top: 4px; }
.tone-up .value { color: var(--up); }
.tone-down .value { color: var(--down); }
.tone-warn .value { color: var(--warn); }
.outlook { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { width: 90px; font-size: 13px; color: var(--muted); }
.bar-track { flex: 1; height: 8px; background: #eeeae3; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.bar-pct { width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }
.pulse-item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.pulse-item .takeaway { font-weight: 500; }
.pulse-item .signal { font-size: 12px; margin-top: 4px; }
.quiet { color: var(--muted); font-size: 13px; }
footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <a href="#tape">Tape</a>
  <a href="#outlook">Outlook</a>
  <a href="#rsdh">RSDH</a>
  <a href="#pulse">X Pulse</a>
  <a href="#news">News</a>
</nav>
<p class="kicker">Daily brief · 2026-10-21</p>
<h1>Market Watcher</h1>
<p class="sub" id="edition-sub">Loading…</p>
<div class="note" id="combined-note">Loading brief…</div>

<div class="section" id="tape">
  <h2>Tape</h2>
  <div class="tape" id="tape-grid"></div>
</div>

<div class="section" id="outlook">
  <h2>Outlook</h2>
  <div class="outlook" id="outlook-bars"></div>
</div>

<div class="section" id="rsdh">
  <h2>RSDH curve</h2>
  <div id="rsdh-card" class="cell">Loading equity curve…</div>
</div>

<div class="section" id="pulse">
  <h2>X Pulse</h2>
  <div id="pulse-list"></div>
</div>

<div class="section" id="news">
  <h2>Key changes</h2>
  <div id="news-list"></div>
</div>

<footer>Market Watcher · paper desk · data unchanged</footer>
</div>

<script>
async function load() {
  try {
    const [latest, pulse, curve] = await Promise.all([
      fetch("./latest.json").then(r => r.json()),
      fetch("./x-pulse.json").then(r => r.json()).catch(() => ({items:[]})),
      fetch("./equity-curve.json").then(r => r.json()).catch(() => null)
    ]);
    document.getElementById("edition-sub").textContent = latest.edition || "2026-10-21";
    document.getElementById("combined-note").textContent = latest.combined_note || "";

    const tape = document.getElementById("tape-grid");
    (latest.story_metrics || []).forEach(m => {
      const el = document.createElement("div");
      el.className = "cell tone-" + (m.tone || "quiet");
      el.innerHTML = `<div class="label">${m.label}</div><div class="value">${m.value}</div><div class="meaning">${m.meaning || ""}</div>`;
      tape.appendChild(el);
    });

    const bars = document.getElementById("outlook-bars");
    (latest.probs || []).forEach(p => {
      const row = document.createElement("div");
      row.className = "bar-row";
      const pct = Math.round((p.prob || 0) * 100);
      row.innerHTML = `<div class="bar-label">${p.label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-pct">${pct}%</div>`;
      bars.appendChild(row);
    });

    const rsdh = document.getElementById("rsdh-card");
    if (curve && curve.points) {
      rsdh.innerHTML = `<div class="label">Equity curve</div><div class="value">${curve.points.length} points</div><div class="meaning">Stub — full chart preserved in source data</div>`;
    } else {
      rsdh.innerHTML = `<div class="label">Equity curve</div><div class="quiet">No curve data</div>`;
    }

    const plist = document.getElementById("pulse-list");
    (pulse.items || []).forEach(p => {
      const el = document.createElement("div");
      el.className = "pulse-item";
      el.innerHTML = `<div class="takeaway">${p.takeaway || p.text || ""}</div><div class="signal">${p.signal || ""}</div>`;
      plist.appendChild(el);
    });
    if (!(pulse.items || []).length) plist.innerHTML = `<div class="quiet">No pulse items</div>`;

    const nlist = document.getElementById("news-list");
    (latest.key_changes || []).forEach(c => {
      const el = document.createElement("div");
      el.className = "pulse-item";
      el.innerHTML = `<div class="takeaway">${c}</div>`;
      nlist.appendChild(el);
    });
    if (!(latest.key_changes || []).length) nlist.innerHTML = `<div class="quiet">No key changes listed</div>`;
  } catch (e) {
    document.body.insertAdjacentHTML("beforeend", `<p class="note" style="margin-top:20px">Failed to load data: ${e.message}</p>`);
  }
}
load();
</script>
</body>
</html>
