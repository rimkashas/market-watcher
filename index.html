        <span>BTC <span class="val">${fmt.usdK(overlay.BTC_usd)}</span></span>
        <span>ETH <span class="val">${fmt.usd(overlay.ETH_usd, 2)}</span></span>
        ${overlay.stables_total_B != null ? `<span>Stables <span class="val">${fmt.Bm(overlay.stables_total_B)}</span></span>` : ""}
        <span>${fmt.esc(overlay.fetched_at || "")}</span>
      </div>`;
    } else if (overlay && overlay.status === "Unavailable") {
      liveHtml = `<div class="live-strip on"><span>Live overlay: Unavailable — ${fmt.esc(overlay.note || "network fail")}; showing brief snapshot.</span></div>`;
    }

    const scoreboardRows = (D.scoreboard || []).map(r =>
      `<tr><td class="dim-name">${fmt.esc(r.lens)}</td><td>${fmt.esc(r.read)}</td><td>${fmt.esc(r.delta)}</td></tr>`
    ).join("") || `<tr><td colspan="3" class="na">Not present in brief</td></tr>`;

    const scorecardRows = (D.scorecard || []).map(r =>
      `<tr><td class="dim-name">${fmt.esc(r.dimension)}</td><td>${fmt.esc(r.now)}</td><td>${fmt.esc(r.vs)}</td></tr>`
    ).join("") || `<tr><td colspan="3" class="na">Not present in brief</td></tr>`;

    const probs = D.probs || {};
    let probsHtml = "";
    if (probs["7d"] || probs["1m"]) {
      const mk = (title, p) => {
        if (!p) return `<div class="card prob-card"><h3>${title}</h3><p class="na">Not present</p></div>`;
        return `<div class="card prob-card"><h3>${title}</h3>
          ${["Base","Bull","Bear"].map(k => {
            const v = p[k]; const cls = k.toLowerCase();
            return `<div class="bar-row"><span>${k}</span><div class="bar-track"><div class="bar-fill ${cls}" style="width:${v}%"></div></div><span class="num">${v}%</span></div>`;
          }).join("")}
        </div>`;
      };
      probsHtml = `<section class="block card"><h2>Outlook probabilities <span class="tag">from brief only</span></h2>
        <div class="probs">${mk("7-day", probs["7d"])}${mk("1-month", probs["1m"])}</div></section>`;
    }

    const bottomRows = (D.bottom_line || []).map(r =>
      `<tr><td class="dim-name">${fmt.esc(r.label)}</td><td>${fmt.esc(r.text)}</td></tr>`
    ).join("");

    const etfBtcRows = (btcEtf.last_5_sessions || []).map(s =>
      `<tr><td>${fmt.esc(s.date_str)}</td><td class="num ${fmt.cls(s.total_m)}">${fmt.m(s.total_m)}</td></tr>`
    ).join("");
    const etfEthRows = (ethEtf.last_5_sessions || []).map(s =>
      `<tr><td>${fmt.esc(s.date_str)}</td><td class="num ${fmt.cls(s.total_m)}">${fmt.m(s.total_m)}</td></tr>`
    ).join("");

    const gaps = (D.hard_gaps || []).map(g => `<li>${fmt.esc(g)}</li>`).join("")
      || `<li class="na">None listed</li>`;

    const hist = (D.history || []).map(h =>
      `<span class="chip ${h.is_current ? "current" : ""}" title="${fmt.esc(h.folder)}">${fmt.esc(h.date)}${h.is_current ? " · current" : ""}</span>`
    ).join("");

    const bhBlock = bh.available ? `
      <div class="grid kpis" style="margin-top:8px">
        <div class="card kpi"><div class="label">BH Cycle</div><div class="value">${fmt.esc(bh.cycle_index)} <span style="font-size:.8rem;color:var(--muted)">${fmt.esc(bh.cycle_phase)}</span></div><div class="hint">${fmt.esc(bh.freshness || "")} · page ${fmt.esc(bh.page_data_date || "")}</div></div>
        <div class="card kpi"><div class="label">BH Breadth</div><div class="value">${fmt.esc(bh.breadth || "—")}</div><div class="hint">spectrum ${bh.cycle_spectrum ? Object.entries(bh.cycle_spectrum).map(([k,v])=>k[0]+v).join(" ") : "—"}</div></div>
        <div class="card kpi"><div class="label">Supply in Profit</div><div class="value">${bh.supply_in_profit_percent != null ? bh.supply_in_profit_percent.toFixed(2)+"%" : "—"}</div><div class="hint">BH card BTC ${fmt.usdK(bh.btc_card_price_usd)} (do not replace Live)</div></div>
        <div class="card kpi"><div class="label">Holder Behavior</div><div class="value">${(bh.categories && bh.categories["Holder Behavior"]) ? (bh.categories["Holder Behavior"].score + " " + bh.categories["Holder Behavior"].phase) : "—"}</div><div class="hint">category scores from BH</div></div>
      </div>` : `<p class="na">BlockHorizon not present in this brief.</p>`;

    const dxy = mac.DXY || {};
    const vix = mac.VIX || {};
    const spx = mac.SPX || {};
    const us10 = mac.US10Y || {};
    const us2 = mac.US2Y || {};

    $("#app").innerHTML = `
      <header class="top">
        <div class="brand">
          <h1>Market Watcher</h1>
          <div class="sub">${fmt.esc(D.edition || D.brief_folder)} · local dashboard</div>
        </div>
        <div class="meta">
          <span class="pill">Updated <strong>${fmt.esc(D.updated_vilnius || "—")}</strong></span>
          <span class="pill">Cutoff <strong>${fmt.esc(D.cutoff_utc || "—")}</strong></span>
          <span class="pill">${fmt.esc(D.session_context || "")}</span>
          <span class="badge ${fmt.badgeClass(regime)}">${fmt.esc(regime)}</span>
        </div>
      </header>

      ${liveHtml}

      ${D.one_line_regime ? `<p class="one-line">${fmt.esc(D.one_line_regime)}</p>` : ""}

      <div class="grid kpis" style="margin-top:12px">
        <div class="card kpi"><div class="label">BTC</div><div class="value">${fmt.usdK(btcShow)}</div><div class="hint ${fmt.cls(since.BTC_pct)}">${since.BTC_pct != null ? fmt.pct(since.BTC_pct)+" since brief" : (c.status||"")}</div></div>
        <div class="card kpi"><div class="label">ETH</div><div class="value">${fmt.usd(ethShow, 2)}</div><div class="hint ${fmt.cls(since.ETH_pct)}">${since.ETH_pct != null ? fmt.pct(since.ETH_pct)+" since brief" : ""}</div></div>
        <div class="card kpi"><div class="label">Fed net</div><div class="value">${fmt.T(mw.net_T)}</div><div class="hint">${fmt.esc(mw.date || "")} · 1w ${fmt.B(fed.delta_1w_B)}</div></div>
        <div class="card kpi"><div class="label">Stables</div><div class="value">${fmt.Bm(st.total_B)}</div><div class="hint ${fmt.cls(st.chg_7d_pct)}">7D ${fmt.pct(st.chg_7d_pct)} · 30D ${fmt.pct(st.chg_30d_pct)}</div></div>
        <div class="card kpi"><div class="label">BTC ETF latest</div><div class="value ${fmt.cls(btcEtf.latest_m)}">${fmt.m(btcEtf.latest_m, 1)}</div><div class="hint">${fmt.esc(btcEtf.latest_date || "")}</div></div>
        <div class="card kpi"><div class="label">BH cycle / breadth</div><div class="value" style="font-size:1rem">${bh.available ? (fmt.esc(String(bh.cycle_index)) + " / " + fmt.esc(bh.breadth||"—")) : "—"}</div><div class="hint">${bh.available ? fmt.esc(bh.cycle_phase||"") : "n/a"}</div></div>
      </div>

      <div class="two-col">
        <section class="block card">
          <h2>1-minute scoreboard</h2>
          <table class="data"><thead><tr><th>Lens</th><th>Read</th><th>Δ vs prior</th></tr></thead>
          <tbody>${scoreboardRows}</tbody></table>
        </section>
        <section class="block card">
          <h2>Regime scorecard</h2>
          <table class="data"><thead><tr><th>Dimension</th><th>Now</th><th>vs prior</th></tr></thead>
          <tbody>${scorecardRows}</tbody></table>
          ${D.combined_note ? `<p class="prose" style="margin-top:10px">${fmt.esc(D.combined_note)}</p>` : ""}
        </section>
      </div>

      <section class="block card">
        <h2>Market snapshot KPIs <span class="tag">${fmt.esc(c.status || "")}</span></h2>
        <table class="data">
          <thead><tr><th>Indicator</th><th class="num">Level</th><th class="num">24h</th><th class="num">5D</th><th class="num">1M</th><th class="num">Since brief</th></tr></thead>
          <tbody>
            <tr><td class="dim-name">BTC</td><td class="num">${fmt.usdK(c.BTC_usd)}</td><td class="num ${fmt.cls(c.BTC_24h_pct)}">${fmt.pct(c.BTC_24h_pct)}</td><td class="num ${fmt.cls(c.BTC_5d_pct)}">${fmt.pct(c.BTC_5d_pct)}</td><td class="num ${fmt.cls(c.BTC_1m_pct)}">${fmt.pct(c.BTC_1m_pct)}</td><td class="num ${fmt.cls(since.BTC_pct)}">${fmt.pct(since.BTC_pct)}</td></tr>
            <tr><td class="dim-name">ETH</td><td class="num">${fmt.usd(c.ETH_usd,2)}</td><td class="num ${fmt.cls(c.ETH_24h_pct)}">${fmt.pct(c.ETH_24h_pct)}</td><td class="num ${fmt.cls(c.ETH_5d_pct)}">${fmt.pct(c.ETH_5d_pct)}</td><td class="num ${fmt.cls(c.ETH_1m_pct)}">${fmt.pct(c.ETH_1m_pct)}</td><td class="num ${fmt.cls(since.ETH_pct)}">${fmt.pct(since.ETH_pct)}</td></tr>
            <tr><td class="dim-name">ETH/BTC</td><td class="num">${c.ETH_BTC != null ? Number(c.ETH_BTC).toFixed(5) : "—"}</td><td class="num" colspan="4">BTC.D ${fmt.num(c.btc_dominance_pct,2)}% · mcap ${c.global_mcap_usd != null ? "$"+(c.global_mcap_usd/1e12).toFixed(3)+"T" : "—"}</td></tr>
            <tr><td class="dim-name">DXY</td><td class="num">${fmt.num(dxy.price,3)}</td><td class="num">—</td><td class="num ${fmt.cls(dxy.chg_5d_pct)}">${fmt.pct(dxy.chg_5d_pct)}</td><td class="num ${fmt.cls(dxy.chg_1m_pct)}">${fmt.pct(dxy.chg_1m_pct)}</td><td class="num">${fmt.esc(dxy.last_hist_date||"")}</td></tr>
            <tr><td class="dim-name">U.S. 10Y</td><td class="num">${us10.price != null ? fmt.num(us10.price,3)+"%" : "—"}</td><td class="num">—</td><td class="num ${fmt.cls(us10.chg_5d_pct)}">${fmt.pct(us10.chg_5d_pct)}</td><td class="num ${fmt.cls(us10.chg_1m_pct)}">${fmt.pct(us10.chg_1m_pct)}</td><td class="num">${fmt.esc(us10.last_hist_date||"")}</td></tr>
            <tr><td class="dim-name">S&P 500</td><td class="num">${fmt.num(spx.price,1)}</td><td class="num">—</td><td class="num ${fmt.cls(spx.chg_5d_pct)}">${fmt.pct(spx.chg_5d_pct)}</td><td class="num ${fmt.cls(spx.chg_1m_pct)}">${fmt.pct(spx.chg_1m_pct)}</td><td class="num">${fmt.esc(spx.last_hist_date||"")}</td></tr>
            <tr><td class="dim-name">VIX</td><td class="num">${fmt.num(vix.price,2)}</td><td class="num">—</td><td class="num ${fmt.cls(vix.chg_5d_pct)}">${fmt.pct(vix.chg_5d_pct)}</td><td class="num ${fmt.cls(vix.chg_1m_pct)}">${fmt.pct(vix.chg_1m_pct)}</td><td class="num">${fmt.esc(vix.last_hist_date||"")}</td></tr>
          </tbody>
        </table>
      </section>

      <section class="block card">
        <h2>Liquidity <span class="tag">${fmt.esc(fed.status || "")}</span></h2>
        ${D.sections_prose && D.sections_prose.liquidity_classify ? `<p class="prose"><strong>Classify:</strong> ${fmt.esc(D.sections_prose.liquidity_classify)}</p>` : ""}
        <table class="data">
          <thead><tr><th>Series</th><th class="num">Latest</th><th>As of</th><th class="num">~1w</th><th class="num">~4w</th></tr></thead>
          <tbody>
            <tr><td class="dim-name">WALCL</td><td class="num">${fmt.Bm(mw.WALCL_B,1)}</td><td>${fmt.esc(mw.date||"")}</td><td class="num">—</td><td class="num">—</td></tr>
            <tr><td class="dim-name">TGA (matched)</td><td class="num">${fmt.Bm(mw.TGA_B,1)}</td><td>${fmt.esc(mw.date||"")}</td><td class="num">—</td><td class="num">—</td></tr>
            <tr><td class="dim-name">ON RRP Others</td><td class="num">${fmt.Bm(mw.RRP_B,3)}</td><td>${fmt.esc(mw.date||"")}</td><td class="num">—</td><td class="num">—</td></tr>
            <tr><td class="dim-name"><strong>Fed net</strong></td><td class="num"><strong>${fmt.T(mw.net_T)}</strong></td><td>${fmt.esc(mw.date||"")}</td><td class="num ${fmt.cls(fed.delta_1w_B)}">${fmt.B(fed.delta_1w_B)}</td><td class="num ${fmt.cls(fed.delta_4w_B)}">${fmt.B(fed.delta_4w_B)}</td></tr>
            <tr><td class="dim-name">Daily TGA</td><td class="num">${fed.daily_TGA ? fmt.Bm(fed.daily_TGA.TGA_B,3) : "—"}</td><td>${fed.daily_TGA ? fmt.esc(fed.daily_TGA.date) : ""}</td><td class="num" colspan="2">${fmt.esc(fed.liquidity_impulse_note || "")}</td></tr>
            <tr><td class="dim-name">Stables total</td><td class="num">${fmt.Bm(st.total_B)}</td><td>${fmt.esc(st.as_of||"")}</td><td class="num ${fmt.cls(st.chg_7d_pct)}">${fmt.pct(st.chg_7d_pct)}</td><td class="num ${fmt.cls(st.chg_30d_pct)}">${fmt.pct(st.chg_30d_pct)}</td></tr>
          </tbody>
        </table>
      </section>

      <div class="two-col">
        <section class="block card">
          <h2>Macro / USD & rates <span class="tag">${fmt.esc(mac.status || "")}</span></h2>
          ${D.sections_prose && D.sections_prose.usd_conclude ? `<p class="prose">${fmt.esc(D.sections_prose.usd_conclude)}</p>` : ""}
          <table class="data">
            <tbody>
              <tr><td class="dim-name">DXY</td><td class="num">${fmt.num(dxy.price,3)}</td><td class="num ${fmt.cls(dxy.chg_5d_pct)}">5D ${fmt.pct(dxy.chg_5d_pct)}</td></tr>
              <tr><td class="dim-name">U.S. 2Y</td><td class="num">${us2 && us2.value != null ? us2.value.toFixed(2)+"%" : "—"}</td><td>${us2 ? fmt.esc(us2.as_of||"") : ""}</td></tr>
              <tr><td class="dim-name">U.S. 10Y</td><td class="num">${us10.price != null ? fmt.num(us10.price,3)+"%" : "—"}</td><td class="num ${fmt.cls(us10.chg_5d_pct)}">5D ${fmt.pct(us10.chg_5d_pct)}</td></tr>
              <tr><td class="dim-name">2s10s</td><td class="num">${mac.spread_2s10s_pp != null ? (mac.spread_2s10s_pp>0?"+":"")+mac.spread_2s10s_pp.toFixed(2)+" pp" : "—"}</td><td></td></tr>
              <tr><td class="dim-name">DFII10</td><td class="num">${mac.DFII10 && mac.DFII10.value != null ? mac.DFII10.value.toFixed(2)+"%" : "—"}</td><td>${mac.DFII10 ? fmt.esc((mac.DFII10.date||"")+" · "+(mac.DFII10.freshness||"")) : ""}</td></tr>
              <tr><td class="dim-name">VIX</td><td class="num">${fmt.num(vix.price,2)}</td><td class="num ${fmt.cls(vix.chg_5d_pct)}">5D ${fmt.pct(vix.chg_5d_pct)}</td></tr>
              <tr><td class="dim-name">SPX / NDX</td><td class="num">${fmt.num(spx.price,1)} / ${fmt.num((mac.NASDAQ||{}).price,1)}</td><td></td></tr>
            </tbody>
          </table>
        </section>

        <section class="block card">
          <h2>Crypto structure <span class="tag">${fmt.esc(c.status || "")}</span></h2>
          ${D.sections_prose && D.sections_prose.crypto_leadership ? `<p class="prose">${fmt.esc(D.sections_prose.crypto_leadership)}</p>` : ""}
          <table class="data">
            <tbody>
              <tr><td class="dim-name">BTC / ETH</td><td class="num">${fmt.usdK(c.BTC_usd)} / ${fmt.usd(c.ETH_usd,0)}</td></tr>
              <tr><td class="dim-name">ETH/BTC</td><td class="num">${c.ETH_BTC != null ? Number(c.ETH_BTC).toFixed(5) : "—"}</td></tr>
              <tr><td class="dim-name">BTC.D</td><td class="num">${fmt.num(c.btc_dominance_pct,2)}%</td></tr>
              <tr><td class="dim-name">Global mcap</td><td class="num">${c.global_mcap_usd != null ? "$"+(c.global_mcap_usd/1e12).toFixed(3)+"T" : "—"} <span class="${fmt.cls(c.global_mcap_24h_pct)}">(${fmt.pct(c.global_mcap_24h_pct)} 24h)</span></td></tr>
              <tr><td class="dim-name">USDT / USDC</td><td class="num">${st.USDT_B != null ? "$"+st.USDT_B+"B" : "—"} / ${st.USDC_B != null ? "$"+st.USDC_B+"B" : "—"}</td></tr>
            </tbody>
          </table>
          ${bhBlock}
        </section>
      </div>

      <div class="two-col">
        <section class="block card">
          <h2>ETF flows <span class="tag">${fmt.esc(etf.status || "")}</span></h2>
          <table class="data">
            <thead><tr><th>Window</th><th class="num">BTC ($m)</th><th class="num">ETH ($m)</th></tr></thead>
            <tbody>
              <tr><td class="dim-name">Latest</td><td class="num ${fmt.cls(btcEtf.latest_m)}">${fmt.m(btcEtf.latest_m)}</td><td class="num ${fmt.cls(ethEtf.latest_m)}">${fmt.m(ethEtf.latest_m)}</td></tr>
              <tr><td class="dim-name">Since after prior</td><td class="num ${fmt.cls(btcEtf.sum_since_after_m)}">${fmt.m(btcEtf.sum_since_after_m)}</td><td class="num ${fmt.cls(ethEtf.sum_since_after_m)}">${fmt.m(ethEtf.sum_since_after_m)}</td></tr>
              <tr><td class="dim-name">Last 5 sessions</td><td class="num ${fmt.cls(btcEtf.sum_last_5_sessions)}">${fmt.m(btcEtf.sum_last_5_sessions)}</td><td class="num ${fmt.cls(ethEtf.sum_last_5_sessions)}">${fmt.m(ethEtf.sum_last_5_sessions)}</td></tr>
            </tbody>
          </table>
          <div class="two-col" style="margin-top:8px">
            <div><strong style="font-size:.78rem;color:var(--dim)">BTC last 5</strong><table class="data"><tbody>${etfBtcRows || '<tr><td class="na">—</td></tr>'}</tbody></table></div>
            <div><strong style="font-size:.78rem;color:var(--dim)">ETH last 5</strong><table class="data"><tbody>${etfEthRows || '<tr><td class="na">—</td></tr>'}</tbody></table></div>
          </div>
        </section>

        <section class="block card">
          <h2>Derivatives <span class="tag">OKX</span></h2>
          <p class="prose">${fmt.esc(der.status || "")}</p>
          <table class="data">
            <thead><tr><th></th><th class="num">BTC</th><th class="num">ETH</th></tr></thead>
            <tbody>
              <tr><td class="dim-name">Funding</td><td class="num">${okx.BTC ? (okx.BTC.funding_rate*100).toFixed(4)+"%" : "—"} <span class="flat">(~${okx.BTC ? fmt.num(okx.BTC.funding_ann_pct_approx,1) : "—"}% ann)</span></td>
                  <td class="num">${okx.ETH ? (okx.ETH.funding_rate*100).toFixed(4)+"%" : "—"} <span class="flat">(~${okx.ETH ? fmt.num(okx.ETH.funding_ann_pct_approx,1) : "—"}% ann)</span></td></tr>
              <tr><td class="dim-name">OI (USD)</td><td class="num">${okx.BTC && okx.BTC.oi_usd != null ? "$"+(okx.BTC.oi_usd/1e9).toFixed(2)+"B" : "—"}</td>
                  <td class="num">${okx.ETH && okx.ETH.oi_usd != null ? "$"+(okx.ETH.oi_usd/1e9).toFixed(2)+"B" : "—"}</td></tr>
              <tr><td class="dim-name">Liquidations</td><td colspan="2">${fmt.esc((der.liquidations && der.liquidations.status) || "Unavailable")}</td></tr>
            </tbody>
          </table>
          ${D.fomc && D.fomc.meeting ? `<p class="prose" style="margin-top:10px"><strong>FOMC ${fmt.esc(D.fomc.meeting)}:</strong> ${fmt.esc(D.fomc.decision||"")} · ${fmt.esc(D.fomc.target_range||"")} · next ${fmt.esc(D.fomc.next_meeting||"")}</p>` : ""}
        </section>
      </div>

      ${probsHtml}

      <section class="block card">
        <h2>Bottom line / STATE</h2>
        ${bottomRows ? `<table class="data"><tbody>${bottomRows}</tbody></table>` : ""}
        ${D.state_excerpt ? `<div class="state-box" style="margin-top:10px">${fmt.esc(D.state_excerpt)}</div>` : `<p class="na">STATE not present</p>`}
      </section>

      <section class="block card">
        <h2>Brief history</h2>
        <div class="history">${hist}</div>
      </section>

      <footer class="foot">
        <p><strong>Freshness:</strong> snapshot from <code>${fmt.esc(D.brief_folder)}</code> · built ${fmt.esc(D.generated_at_vilnius || "")} · timezone ${fmt.esc(D.timezone || "Europe/Vilnius")}</p>
        <p><strong>Hard gaps:</strong></p>
        <ul class="gaps">${gaps}</ul>
        <p style="margin-top:10px"><strong>Not financial advice.</strong> Local research dashboard only. Numbers come from the brief datapack / BRIEF.md; outlook probabilities shown only when present in the brief. Live overlay (if any) refreshes Coinbase + DefiLlama into the strip only and does not rewrite Fed/ETF/regime fields.</p>
      </footer>
    `;
  }

  async function boot() {
    let D = null;
    try {
      const emb = document.getElementById("embedded-data");
      if (emb && emb.textContent) D = JSON.parse(emb.textContent);
    } catch (e) {}
    try {
      const r = await fetch("data/latest.json", {cache: "no-store"});
      if (r.ok) D = await r.json();
    } catch (e) {}
    try {
      const r2 = await fetch("data/live_overlay.json", {cache: "no-store"});
      if (r2.ok) {
        const ov = await r2.json();
        if (D) D.live_overlay = ov;
      }
    } catch (e) {}
    if (!D) {
      $("#app").innerHTML = "<p class='na'>No data. Run build_site.py</p>";
      return;
    }
    render(D);
  }
  boot();
})();
</script>
</body>
</html>
