<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Market Watcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/paper.css">
</head>
<body>
<div class="wrap">
<header class="desk-head">
  <div>
    <p class="desk-brand">Market Watcher</p>
    <p class="desk-date" id="desk-date">&nbsp;</p>
  </div>
  <div class="desk-upd" id="desk-upd"></div>
</header>
<nav class="desk-nav" id="desk-nav" aria-label="Sections"></nav>
<main id="desk-main"><p class="desk-load">Loading…</p></main>
<footer class="desk-foot" id="desk-foot"></footer>
</div>
<script>
// Static shell: everything day-specific comes from ./latest.json (export_paper_desk.py).
(async function () {
  const main = document.getElementById("desk-main");
  let d;
  try {
    const r = await fetch("./latest.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (e) {
    main.innerHTML = `<p class="desk-load">Data unavailable (${String(e.message).replace(/[<>&]/g, "")}).</p>`;
    return;
  }
  const t = s => String(s == null ? "" : s);
  document.title = d.date ? `Market Watcher · ${d.date}` : "Market Watcher";
  const dateEl = document.getElementById("desk-date");
  dateEl.textContent = t(d.date);
  if (d.regime) {
    const rg = document.createElement("span");
    rg.className = "rg " + t(d.regime_class);
    rg.textContent = d.regime;
    dateEl.append(" · ", rg);
  }
  document.getElementById("desk-upd").textContent = d.updated ? `Updated ${d.updated}` : "";
  document.getElementById("desk-foot").textContent = d.date ? `Snapshot · ${d.date}` : "";

  const nav = document.getElementById("desk-nav");
  main.innerHTML = "";
  (d.sections || []).forEach(s => {
    const sec = document.createElement("div");
    sec.className = "desk-sec";
    sec.id = s.id;
    sec.innerHTML = s.html;          // rendered + escaped server-side by the exporter
    main.appendChild(sec);
    const a = document.createElement("a");
    a.href = "#" + s.id;
    a.textContent = s.nav;
    nav.appendChild(a);
  });

  // Scroll-spy: highlight the last section whose top has passed under the sticky nav.
  const links = [...nav.querySelectorAll("a")];
  const secs = links.map(a => document.getElementById(a.hash.slice(1)));
  function spy() {
    const y = nav.getBoundingClientRect().bottom + 12;
    let idx = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= y) idx = i; });
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) idx = secs.length - 1;
    links.forEach((a, i) => a.classList.toggle("active", i === idx));
    const act = links[idx];
    if (act && (act.offsetLeft < nav.scrollLeft || act.offsetLeft + act.offsetWidth > nav.scrollLeft + nav.clientWidth))
      nav.scrollLeft = act.offsetLeft - 16;
  }
  window.addEventListener("scroll", spy, { passive: true });
  window.addEventListener("resize", spy);
  spy();
  if (location.hash && document.getElementById(location.hash.slice(1)))
    document.getElementById(location.hash.slice(1)).scrollIntoView();
})();
</script>
</body>
</html>
